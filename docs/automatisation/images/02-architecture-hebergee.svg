<text x="40" y="28" font-size="28" fill="#1e1e1e">Automatisation AIGMS — architecture hébergée (n8n Cloud)</text>
<text x="40" y="56" font-size="16" fill="#757575">Aucun serveur à tenir. En contrepartie, tout doit être joignable depuis l’internet.</text>
