<text x="510" y="398.5" font-size="14" fill="#22c55e" text-anchor="middle">agit</text>
<text x="40" y="476" font-size="16" fill="#ef4444">Ce que cette architecture interdit :</text>
<text x="40" y="504" font-size="14" fill="#1e1e1e">• atteindre un SI interne sans le publier</text>
<text x="40" y="529" font-size="14" fill="#1e1e1e">• garder les secrets dans votre périmètre</text>
<text x="40" y="554" font-size="14" fill="#1e1e1e">• maîtriser la localisation des exécutions</text>
<text x="40" y="606" font-size="16" fill="#22c55e">Ce qu’elle apporte :</text>
<text x="40" y="634" font-size="14" fill="#1e1e1e">• aucun serveur, aucune mise à jour à tenir</text>
<text x="40" y="659" font-size="14" fill="#1e1e1e">• disponibilité assurée par l’éditeur</text>
