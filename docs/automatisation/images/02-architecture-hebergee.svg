<text x="70" y="334" font-size="14" fill="#ef4444">Vos identifiants AIGMS</text>
<text x="70" y="352.2" font-size="14" fill="#ef4444">sortent de votre périmètre.</text>
<rect x="620" y="90" width="500" height="300" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1" stroke-opacity="0.35"/>
