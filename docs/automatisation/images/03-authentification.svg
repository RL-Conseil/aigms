<text x="1250" y="670.6" font-size="16" fill="#1e1e1e" text-anchor="middle">(append-only)</text>
<text x="40" y="445" font-size="15" fill="#ef4444">Jamais la clé service_role</text>
<text x="40" y="464.5" font-size="15" fill="#ef4444">dans un workflow : elle</text>
<text x="40" y="484" font-size="15" fill="#ef4444">contourne la RLS.</text>
<text x="560" y="734" font-size="14" fill="#1e1e1e">Ce que la base refuse, quoi qu’un workflow tente : approuver une décision,</text>
<text x="560" y="759" font-size="14" fill="#1e1e1e">accepter un risque, viser une étude, valider une preuve, franchir un jalon.</text>
