<text x="230" y="190.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Entra ID — CARITIS</text>
<text x="70" y="239" font-size="14" fill="#757575">L’AI Governance Officer,</text>
<text x="70" y="257.2" font-size="14" fill="#757575">les consultants.</text>
