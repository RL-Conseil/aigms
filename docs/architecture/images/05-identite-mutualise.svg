<text x="230" y="463.1" font-size="16" fill="#1e1e1e" text-anchor="middle">Sans annuaire — Client C</text>
<text x="70" y="514" font-size="14" fill="#757575">Comptes locaux, mot de passe.</text>
<rect x="500" y="230" width="300" height="90" rx="12" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2" stroke-opacity="1"/>
