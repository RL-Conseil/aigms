<text x="40" y="26" font-size="26" fill="#1e1e1e">Identité en mutualisé — un annuaire par client, une seule plateforme</text>
<text x="40" y="56" font-size="16" fill="#757575">L’annuaire dit QUI vous êtes. AIGMS dit CE QUE vous avez le droit de faire.</text>
