<line x1="330" y1="200" x2="850" y2="310" stroke="#4a9eed" stroke-width="2"  marker-end="url(#m7680)"/>
<rect x="40" y="620" width="1320" height="210" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-width="1" stroke-opacity="0.35"/>
<text x="56" y="646" font-size="16" fill="#22c55e">Ce que l’officer garde</text>
<rect x="80" y="680" width="400" height="70" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="280" y="720.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Un pilotage par cellule</text>
<rect x="510" y="680" width="400" height="70" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="710" y="710.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Le portefeuille entier</text>
<text x="710" y="730.6" font-size="16" fill="#1e1e1e" text-anchor="middle">dans la cellule standard</text>
<rect x="940" y="680" width="380" height="70" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="1130" y="720.6" font-size="16" fill="#1e1e1e" text-anchor="middle">4 connexions, 1 identité</text>
<text x="40" y="886" font-size="16" fill="#1e1e1e">Vous vendez 4 VPS au lieu de 50, et vous tenez 4 sauvegardes au lieu de 50.</text>
