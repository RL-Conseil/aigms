<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="933" viewBox="0 0 1400 933" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1400" height="933" fill="#ffffff"/>
<text x="40" y="26" font-size="26" fill="#1e1e1e">Cellules — vendre du VPS sans multiplier l’identité</text>
<text x="40" y="56" font-size="16" fill="#757575">Un serveur par segment, pas par client. Quatre connexions au lieu de cinquante.</text>
<rect x="40" y="120" width="300" height="80" rx="12" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2" stroke-opacity="1"/>
<text x="190" y="155.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Entra ID — CARITIS</text>
<text x="190" y="175.6" font-size="16" fill="#1e1e1e" text-anchor="middle">l’officer, une identité</text>
<rect x="40" y="250" width="1320" height="300" rx="12" fill="#e5dbff" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.35"/>
<text x="56" y="276" font-size="16" fill="#8b5cf6">Les cellules, chez IZARHOST</text>
<rect x="80" y="310" width="290" height="90" rx="12" fill="#d0bfff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="1"/>
<text x="225" y="350.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Cellule STANDARD</text>
<text x="225" y="370.6" font-size="16" fill="#1e1e1e" text-anchor="middle">15 à 20 clients</text>
<rect x="400" y="310" width="290" height="90" rx="12" fill="#d0bfff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="1"/>
<text x="545" y="350.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Cellule SOUVERAINE</text>
<text x="545" y="370.6" font-size="16" fill="#1e1e1e" text-anchor="middle">données en France</text>
<rect x="720" y="310" width="290" height="90" rx="12" fill="#ffd8a8" fill-opacity="1" stroke="#f59e0b" stroke-width="2" stroke-opacity="1"/>
<text x="865" y="350.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Cellule DÉDIÉE</text>
<text x="865" y="370.6" font-size="16" fill="#1e1e1e" text-anchor="middle">1 client exigeant</text>
<rect x="1040" y="310" width="280" height="90" rx="12" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2" stroke-opacity="1"/>
<text x="1180" y="350.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Cellule PRÉPROD</text>
<text x="1180" y="370.6" font-size="16" fill="#1e1e1e" text-anchor="middle">démonstration</text>
<text x="80" y="435" font-size="15" fill="#1e1e1e">Chaque cellule : AIGMS + n8n + Postgres, et N organisations isolées par la RLS.</text>
<text x="80" y="465" font-size="15" fill="#f59e0b">La cellule dédiée se facture — c’est une option, pas la règle.</text>
