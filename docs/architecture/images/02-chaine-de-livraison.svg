<text x="600" y="185.6" font-size="16" fill="#1e1e1e" text-anchor="middle">1. Tests et types</text>
<rect x="440" y="230" width="320" height="70" rx="12" fill="#d0bfff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="1"/>
<text x="600" y="260.6" font-size="16" fill="#1e1e1e" text-anchor="middle">2. docker build</text>
<text x="600" y="280.6" font-size="16" fill="#1e1e1e" text-anchor="middle">image: aigms:v1.4.0</text>
<rect x="440" y="320" width="320" height="70" rx="12" fill="#d0bfff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="1"/>
<text x="600" y="350.6" font-size="16" fill="#1e1e1e" text-anchor="middle">3. Publication</text>
<text x="600" y="370.6" font-size="16" fill="#1e1e1e" text-anchor="middle">ghcr.io/rl-conseil/aigms</text>
<rect x="440" y="410" width="320" height="70" rx="12" fill="#d0bfff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2" stroke-opacity="1"/>
<text x="600" y="440.6" font-size="16" fill="#1e1e1e" text-anchor="middle">4. Migrations jouées</text>
<text x="600" y="460.6" font-size="16" fill="#1e1e1e" text-anchor="middle">sur la préprod</text>
<rect x="840" y="100" width="280" height="420" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1" stroke-opacity="0.35"/>
