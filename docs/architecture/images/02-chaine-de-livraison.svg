<text x="40" y="596" font-size="16" fill="#ef4444">Retour arrière :</text>
<text x="40" y="625" font-size="15" fill="#1e1e1e">docker compose up -d aigms:v1.3.0 — la version précédente reprend la main en trente secondes.</text>
<text x="40" y="665" font-size="15" fill="#1e1e1e">Les migrations, elles, ne reviennent pas en arrière : une correction se livre par une migration de plus.</text>
