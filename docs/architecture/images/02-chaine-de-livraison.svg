<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="711" viewBox="0 0 1160 711" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1160" height="711" fill="#ffffff"/>
<text x="40" y="28" font-size="28" fill="#1e1e1e">Chaîne de livraison — votre poste n’y figure pas</text>
<text x="40" y="56" font-size="16" fill="#757575">Vous codez et vous posez une étiquette. La machine fait le reste.</text>
<rect x="40" y="100" width="320" height="420" rx="12" fill="#d3f9d8" fill-opacity="0.35" stroke="#22c55e" stroke-width="1" stroke-opacity="0.35"/>
<text x="56" y="126" font-size="16" fill="#22c55e">Votre poste</text>
<rect x="70" y="150" width="260" height="70" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="200" y="180.6" font-size="16" fill="#1e1e1e" text-anchor="middle">npm run dev</text>
<text x="200" y="200.6" font-size="16" fill="#1e1e1e" text-anchor="middle">supabase start</text>
<rect x="70" y="240" width="260" height="70" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="200" y="270.6" font-size="16" fill="#1e1e1e" text-anchor="middle">typecheck · lint · test</text>
<text x="200" y="290.6" font-size="16" fill="#1e1e1e" text-anchor="middle">supabase db reset</text>
<rect x="70" y="330" width="260" height="60" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="200" y="365.6" font-size="16" fill="#1e1e1e" text-anchor="middle">git push sur dev</text>
<rect x="70" y="410" width="260" height="70" rx="12" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2" stroke-opacity="1"/>
<text x="200" y="440.6" font-size="16" fill="#1e1e1e" text-anchor="middle">git tag v1.4.0</text>
<text x="200" y="460.6" font-size="16" fill="#1e1e1e" text-anchor="middle">git push origin v1.4.0</text>
<text x="70" y="509" font-size="14" fill="#757575">Aucune commande Docker.</text>
<rect x="410" y="100" width="380" height="420" rx="12" fill="#e5dbff" fill-opacity="0.35" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.35"/>
