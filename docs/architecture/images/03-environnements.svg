<svg xmlns="http://www.w3.org/2000/svg" width="1486" height="701" viewBox="0 0 1486 701" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1486" height="701" fill="#ffffff"/>
<text x="40" y="28" font-size="28" fill="#1e1e1e">Trois environnements, une seule direction</text>
<text x="40" y="56" font-size="16" fill="#757575">Qui décide de quoi, et où les migrations s’appliquent.</text>
<rect x="40" y="120" width="300" height="100" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="190" y="165.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Poste de développement</text>
<text x="190" y="185.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Supabase local (CLI)</text>
<text x="40" y="249" font-size="14" fill="#757575">Migrations rejouées</text>
<text x="40" y="267.2" font-size="14" fill="#757575">à volonté.</text>
<defs><marker id="m4340" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#22c55e"/></marker></defs>
<line x1="340" y1="170" x2="460" y2="170" stroke="#22c55e" stroke-width="2"  marker-end="url(#m4340)"/>
<rect x="347.8" y="156" width="104.4" height="22" fill="#ffffff" opacity="0.92"/>
<text x="400" y="173.5" font-size="14" fill="#22c55e" text-anchor="middle">git push dev</text>
<rect x="480" y="120" width="320" height="100" rx="12" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2" stroke-opacity="1"/>
<text x="640" y="165.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Préprod</text>
<text x="640" y="185.6" font-size="16" fill="#1e1e1e" text-anchor="middle">VPS ou Vercel + Supabase</text>
<text x="480" y="249" font-size="14" fill="#757575">Migrations appliquées</text>
<text x="480" y="267.2" font-size="14" fill="#757575">automatiquement.</text>
<text x="480" y="285.4" font-size="14" fill="#757575">Jeu de démonstration.</text>
<defs><marker id="m7200" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ef4444"/></marker></defs>
<line x1="800" y1="170" x2="940" y2="170" stroke="#ef4444" stroke-width="2"  marker-end="url(#m7200)"/>
<rect x="802.4" y="156" width="135.20000000000002" height="22" fill="#ffffff" opacity="0.92"/>
<text x="870" y="173.5" font-size="14" fill="#ef4444" text-anchor="middle">décision humaine</text>
<rect x="960" y="120" width="320" height="100" rx="12" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2" stroke-opacity="1"/>
<text x="1120" y="165.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Production</text>
<text x="1120" y="185.6" font-size="16" fill="#1e1e1e" text-anchor="middle">VPS client</text>
<text x="960" y="249" font-size="14" fill="#757575">Migrations appliquées</text>
<text x="960" y="267.2" font-size="14" fill="#757575">sur étiquette, après</text>
<text x="960" y="285.4" font-size="14" fill="#757575">sauvegarde vérifiée.</text>
<rect x="40" y="330" width="1240" height="230" rx="12" fill="#dbe4ff" fill-opacity="0.35" stroke="#4a9eed" stroke-width="1" stroke-opacity="0.35"/>
<text x="56" y="356" font-size="16" fill="#4a9eed">Ce que chaque bascule exige</text>
<rect x="80" y="390" width="360" height="60" rx="12" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2" stroke-opacity="1"/>
<text x="260" y="425.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Préprod : tests verts</text>
<rect x="470" y="390" width="360" height="60" rx="12" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2" stroke-opacity="1"/>
<text x="650" y="425.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Production : sauvegarde restaurable</text>
<rect x="860" y="390" width="380" height="60" rx="12" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2" stroke-opacity="1"/>
<text x="1050" y="425.6" font-size="16" fill="#1e1e1e" text-anchor="middle">Production : décision du propriétaire</text>
<text x="80" y="495" font-size="15" fill="#1e1e1e">La production ne se déploie jamais depuis une branche de travail, et jamais sans étiquette.</text>
<text x="40" y="625" font-size="15" fill="#ef4444">Aujourd’hui : préprod = Vercel + Supabase Cloud (91 migrations), production = arrêtée à la 16e.</text>
<text x="40" y="655" font-size="15" fill="#1e1e1e">La bascule sur VPS ne change pas cette règle : elle change seulement où les conteneurs tournent.</text>
</svg>