<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="560" viewBox="0 0 1330 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1330" height="560" fill="#ffffff"/>
<text x="40" y="26" font-size="26" fill="#101c28">De l’usage sauvage au cadre — le cas BATIVAL</text>
<text x="40" y="56" font-size="16" fill="#535c66">Des commerciaux génèrent leurs devis sur ChatGPT personnel, avec d’anciens devis en pièce jointe.</text>
<rect x="40" y="100" width="480" height="420" rx="12" fill="#ffe3e3" fill-opacity="0.35" stroke="#ef4444" stroke-width="1" stroke-opacity="0.35"/>
<text x="56" y="126" font-size="16" fill="#ef4444">Aujourd’hui — personne ne sait</text>
<rect x="70" y="160" width="420" height="60" rx="12" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2" stroke-opacity="1"/>
<text x="280" y="195.25" font-size="15" fill="#101c28" text-anchor="middle">Comptes ChatGPT personnels</text>
<rect x="70" y="240" width="420" height="60" rx="12" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2" stroke-opacity="1"/>
<text x="280" y="275.25" font-size="15" fill="#101c28" text-anchor="middle">Devis, marges, prix fournisseurs</text>
<rect x="70" y="320" width="420" height="60" rx="12" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2" stroke-opacity="1"/>
<text x="280" y="355.25" font-size="15" fill="#101c28" text-anchor="middle">Serveurs publics, hors contrat</text>
<text x="70" y="415" font-size="15" fill="#ef4444">Aucune trace. Aucun responsable désigné.</text>
<text x="70" y="434.5" font-size="15" fill="#ef4444">Aucune preuve à montrer si le sujet remonte.</text>
