<text x="835" y="187.75" font-size="15" fill="#101c28" text-anchor="middle">Cas d’usage au registre</text>
<rect x="1000" y="155" width="260" height="55" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="1130" y="187.75" font-size="15" fill="#101c28" text-anchor="middle">Criticité et qualification</text>
<rect x="700" y="230" width="270" height="55" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="835" y="262.75" font-size="15" fill="#101c28" text-anchor="middle">Risque coté et traité</text>
<rect x="1000" y="230" width="260" height="55" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="1130" y="262.75" font-size="15" fill="#101c28" text-anchor="middle">Contrôles et outillage</text>
