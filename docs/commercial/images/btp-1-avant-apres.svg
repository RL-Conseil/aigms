<text x="835" y="337.75" font-size="15" fill="#101c28" text-anchor="middle">Preuves rattachées</text>
<rect x="1000" y="305" width="260" height="55" rx="12" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2" stroke-opacity="1"/>
<text x="1130" y="337.75" font-size="15" fill="#101c28" text-anchor="middle">Étude d’impact signée</text>
<rect x="700" y="380" width="560" height="60" rx="12" fill="#c3fae8" fill-opacity="1" stroke="#09aeae" stroke-width="2" stroke-opacity="1"/>
<text x="980" y="415.25" font-size="15" fill="#101c28" text-anchor="middle">Décision de mise en production, assumée nommément</text>
<text x="700" y="475" font-size="15" fill="#22c55e">Le registre ne bloque pas l’usage : il le rend visible, puis exigible.</text>
